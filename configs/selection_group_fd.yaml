# Schema-2 selection-only quickstart. Relative paths resolve beside this file.
schema_version: 2
problem:
  soil: homogeneous
data:
  path: ../intermediate/data/th.txt
  format: txt
  depths: [0.10, 0.12, 0.14, 0.16, 0.18]
preprocess:
  differentiation: fd
structure:
  selector: group
  grouping:
    min_group_size: 200
    normalization: global
    merge_tail: 0.01
inversion:
  enabled: false
runtime:
  device: cpu
  save_library: true
